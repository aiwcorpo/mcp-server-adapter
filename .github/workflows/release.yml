# Publishes a tagged release as an image on ghcr.io (ghcr.io/aiwcorpo/mcp-server-adapter:<version>) and keeps a CycloneDX SBOM
# as a workflow artifact. Runs only on a v* tag; nothing is published from branches. Not run yet: the repository and the
# organization packages do not exist at the time of writing.
#
# Two jobs, so that no job with a write permission runs a build tool: build has contents: read and packages: read (the platform
# artifacts mcp-platform-starter and mcp-contracts are read with the GITHUB_TOKEN of the run; the packages must grant access to
# this repository), runs the tests, mvnw and docker build, and hands the image over as a docker save tarball. publish has
# packages: write, no checkout and no cache; it only runs docker load and docker push, with the token in the environment of
# the push step.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      MCP_MAVEN_REPOSITORY_URL: https://maven.pkg.github.com/aiwcorpo/mcp-contracts
      MCP_MAVEN_REPOSITORY_USER: ${{ github.actor }}
      MCP_MAVEN_REPOSITORY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Tag matches the project version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(./mvnw -q -B -N help:evaluate -Dexpression=project.version -DforceStdout)" = "$version"
      - name: Verify (tests, none skipped)
        run: ci/run.sh verify
      - name: Build the jar and the SBOM
        run: ./mvnw -B -s .ci/settings.xml -DskipTests package org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - name: Build the image and save it
        run: |
          image="ghcr.io/aiwcorpo/mcp-server-adapter:${GITHUB_REF_NAME#v}"
          docker build -t "$image" .
          mkdir -p out
          docker save "$image" -o out/image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image
          path: out/image.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: target/bom.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image
          path: out
      - name: Push the image
        run: |
          docker load -i out/image.tar
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker push "ghcr.io/aiwcorpo/mcp-server-adapter:${GITHUB_REF_NAME#v}"
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
