# Publishes a tagged release as an image on ghcr.io (ghcr.io/aiwcorpo/mcp-server-adapter:<version>) and attaches a CycloneDX SBOM
# to the GitHub Release. Runs only on a v* tag; nothing is published from branches. Not run yet: the repository and the
# organization packages do not exist at the time of writing.
#
# Three jobs, so that no job with a write permission runs a build tool: build has contents: read (the platform artifacts
# mcp-platform-starter and mcp-contracts come from Maven Central), runs the tests, mvnw and docker build, and hands the image
# and the SBOM over as artifacts. publish has packages: write, no checkout and no cache; it only runs docker load, a lookup of
# the version in the registry and docker push, with the token in the environment of the push step. release has contents: write,
# no checkout and no build tool; it creates the draft GitHub Release with the SBOM, the token in the environment of that step.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The whole history, so that the next step can see whether the tagged commit is on main.
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Tag matches the project version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(./mvnw -q -B -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)" = "$version"
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify
        run: ./mvnw -B verify
      - name: Build the jar and the SBOM
        run: ./mvnw -B -DskipTests package org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -Dcyclonedx.skipNotDeployed=false
      - name: Build the image and save it
        run: |
          image="ghcr.io/aiwcorpo/mcp-server-adapter:${GITHUB_REF_NAME#v}"
          docker build -t "$image" .
          mkdir -p out
          docker save "$image" -o out/image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image
          path: out/image.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: target/bom.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image
          path: out
      - name: Check the artifact file list
        run: |
          cd out
          unexpected="$(find . -mindepth 1 | sed 's|^\./||' | grep -Evx 'image\.tar' || true)"
          if [ -n "$unexpected" ]; then echo "unexpected files in the artifact:" >&2; echo "$unexpected" >&2; exit 1; fi
          test -f image.tar
      - name: Push the image
        run: |
          image="ghcr.io/aiwcorpo/mcp-server-adapter:${GITHUB_REF_NAME#v}"
          docker load -i out/image.tar
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          # A published version is immutable (SECURITY.md): a tag pushed again must not replace the image.
          if docker manifest inspect "$image" > /dev/null 2>&1; then echo "$image is already published" >&2; exit 1; fi
          docker push "$image"
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
          path: sbom
      - name: Check the artifact file list
        run: |
          unexpected="$(cd sbom && find . -mindepth 1 | sed 's|^\./||' | grep -Evx 'bom\.(json|xml)' || true)"
          if [ -n "$unexpected" ]; then echo "unexpected files in the artifact:" >&2; echo "$unexpected" >&2; exit 1; fi
          test -f sbom/bom.json -a -f sbom/bom.xml
      - name: Attach the SBOM to the GitHub Release
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" "${flags[@]}" sbom/bom.json sbom/bom.xml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
