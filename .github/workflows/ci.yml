# Thin wrapper: all logic is in ci/run.sh. The tests need no container runtime, no token and no secret: the job reads the
# repository, and the platform artifacts (mcp-platform-starter, mcp-contracts) come from Maven Central.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: maven:3.9.12-eclipse-temurin-25@sha256:4f82a03a7d6679281952d628131299b1be88d7030a49c6a2b7d2ba2642e44e3e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: ci/run.sh verify
