# The tests need no container runtime, so verify runs on any runner; only the image job of the default branch needs the Docker
# socket (runner tagged docker-socket). The platform artifacts come from Maven Central, so no credentials are needed.
# The rule of build-image is text of the branch being built, so it does not keep other branches off the socket: the runner tagged
# docker-socket must be a protected runner and the default branch a protected branch.
stages:
  - verify
  - image

default:
  image: maven:3.9.12-eclipse-temurin-25@sha256:4f82a03a7d6679281952d628131299b1be88d7030a49c6a2b7d2ba2642e44e3e

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

verify:
  stage: verify
  cache:
    key: maven
    policy: pull
    paths: [.m2/repository]
  script:
    - ./mvnw -B verify
  artifacts:
    when: always
    paths: [target/mcp-server-adapter.jar]
    reports:
      junit: "target/surefire-reports/TEST-*.xml"

build-image:
  stage: image
  tags: [docker-socket]
  needs: [verify]
  script:
    - docker build -t mcp-server-adapter:$CI_COMMIT_SHORT_SHA .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
