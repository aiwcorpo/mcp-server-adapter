# Base configuration is the production one: TLS on the server port (the author's own certificate, or one the starter generates
# into MCP_STATE_DIR), the gateway's internal JWT on every path but the health check, the one-time jti in memory.
# Everything that differs per environment comes from environment variables (README, "Configuration"); the starter reads
# MCP_TLS_*, MCP_PLAIN_HTTP, MCP_STATE_DIR, MCP_REDIS_* and MCP_PAGING_CURSOR_KEY itself.
# The 'dev' profile (tests, see application-dev.yml) only turns off TLS; the other development relaxations come from
# TestGateway and the starter refuses them outside 'dev'.
server:
  port: ${MCP_PORT:8443}
  address: ${MCP_BIND:0.0.0.0}

spring:
  application:
    name: mcp-server-adapter
  ai:
    mcp:
      server:
        # Transport (streamable HTTP, SYNC, endpoint /mcp) is defaulted by the starter.
        name: ${aiwcorpo.mcp.platform.server-id}
        version: '@project.version@'

aiwcorpo:
  mcp:
    platform:
      # One adapter serves one system; the id is mcp-<system> with any SystemId of the contracts, no list of systems is built in. The
      # server must be added in the gateway with adapter=true (it cannot be changed afterwards) under exactly this id. No default.
      server-id: ${MCP_SERVER_ID:}
      internal-jwt:
        # The sidecar of an adapter (CC-226): tools/call must carry the classification of the administrator (mcp_risk, mcp_action), else 401
        # classification_missing. A native server refuses those claims.
        receiver-mode: adapter
        issuer: ${MCP_GATEWAY_ISSUER:https://mcp-gateway.internal}
        # The public key set of the gateway: https://<domain>/.well-known/mcp-jwks.json
        jwks-uri: ${MCP_GATEWAY_JWKS_URI:}
      credential:
        connect-url: ${MCP_CONNECT_URL:}
      # Description of this server (GET /.well-known/mcp-manifest, C6, source: adapter, pulled by the gateway); the tool entries come from
      # the foreign server. The allowed AI clients and the other policy data are pushed by the gateway; nothing to configure for them.
      manifest:
        version: '@project.version@'
        accepted-credential-types: ${MCP_ACCEPTED_CREDENTIAL_TYPES:user-secret}
        output-file: ${MCP_MANIFEST_OUTPUT_FILE:}
    adapter:
      foreign:
        url: ${MCP_FOREIGN_URL:}
        mcp-path: ${MCP_FOREIGN_PATH:/mcp}
        # How the credential of the user is presented to the foreign server; {credential} is the value from X-MCP-Credential.
        authorization-format: ${MCP_FOREIGN_AUTHORIZATION_FORMAT:Token {credential}}
        # Sent only with the startup tools/list. Some servers refuse every request without an Authorization header although
        # listing needs no access to the system; this is not a credential of anyone.
        discovery-authorization: ${MCP_FOREIGN_DISCOVERY_AUTHORIZATION:}
        startup-wait: ${MCP_FOREIGN_STARTUP_WAIT:90s}
        ssl-bundle: ${MCP_FOREIGN_SSL_BUNDLE:}
        allow-plain-http: ${MCP_FOREIGN_ALLOW_PLAIN_HTTP:false}
      limits:
        # Text a user writes (a comment, a description, a page body) is longer than an identifier; the limit of any other text argument is
        # string-max-length (4096). Arguments are matched by name, in every tool.
        string-max-length-by-property:
          body: 32768
          comment: 32768
          description: 32768
          content: 32768
      tools:
        include: ${MCP_ADAPTER_TOOLS_INCLUDE:}
        strip-prefix: ${MCP_ADAPTER_STRIP_PREFIX:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: mcp-server-adapter
