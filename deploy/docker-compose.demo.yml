# Reference fragment for the adapter demo (Jira through sooperset/mcp-atlassian 0.23.1). It is not started by this repository: ws-01
# merges it into the dev stack. The adapter takes the place of the native mcp-jira (same server id and network alias), so the
# gateway must have the server mcp-jira added with adapter=true (at creation, it cannot be changed later) and the native mcp-jira
# container must not run at the same time.
#
# Variables: ADAPTER_IMAGE (mcp-server-adapter:<tag>) and MCP_GATEWAY_JWKS_URI (the public key set of the gateway). The adapter has no
# policy settings: it has no policies and takes the policy data the gateway pushes without evaluating it (starter 4.0.0). It speaks plain http
# on the private network of the stack, so the server is added in the gateway with allowPlainHttp (CC-249), and it needs no certificate, no
# Redis and no registry channel: the gateway pulls its manifest (source: adapter). Nothing in this file is a secret: JIRA_PERSONAL_TOKEN is a
# placeholder the foreign server never uses.
services:
  mcp-atlassian:
    image: ghcr.io/sooperset/mcp-atlassian@sha256:5b7c9b64d4eb3210cab74be8bf3e6aeea9ed14f3042dc59ba5c5287bd4dbe466
    pull_policy: never
    command: ["--transport", "streamable-http", "--port", "8000", "--host", "0.0.0.0"]
    environment:
      JIRA_URL: http://jira.internal:8080
      JIRA_PERSONAL_TOKEN: placeholder-never-used
      ALLOW_GLOBAL_CRED_FALLBACK: "false"
      TOOLSETS: all
      # Read-only tools only: since contracts 6.3.0 (CC-227) the gateway classifies an adapter tool only as READ_ONLY. Adding a write tool here
      # makes it pending with no classification the administrator may give, so it stays hidden (tool_disabled).
      ENABLED_TOOLS: jira_get_issue,jira_search,jira_get_all_projects,jira_get_transitions
    # Foreign code, the least trusted container of the stack. Checked on the pinned image: it runs as uid 1000 (user "app") and works with
    # a read-only root file system, no capabilities and these limits.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    # No published port. Two networks and no others: "adapter-foreign" (with the adapter) and "jira-foreign" (with the Jira mock). Not
    # "servers" and not "core": from there it would see Redis, the policy server and the other servers. On "jira-foreign" it still reaches the whole port of the mock,
    # WireMock /__admin included (protected by basic auth only), so that is one more reason to keep every foreign container off other networks.
    networks:
      adapter-foreign: {}
      jira-foreign: {}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Extends the existing service of the dev stack: the mock answers to jira.internal on the private network of the foreign server
  # too. The alias there is the same name as on "servers" and "core", which are left as they are.
  jira-mock:
    networks:
      jira-foreign:
        aliases: [jira.internal]

  mcp-jira-adapter:
    image: ${ADAPTER_IMAGE}
    pull_policy: never
    environment:
      MCP_SERVER_ID: mcp-jira
      MCP_GATEWAY_JWKS_URI: ${MCP_GATEWAY_JWKS_URI:?the public https://<domain>/.well-known/mcp-jwks.json of the gateway}
      MCP_GATEWAY_ISSUER: https://mcp-gateway.internal
      MCP_CONNECT_URL: https://localhost:${PROXY_TLS_PORT}/connections?system={system}
      MCP_ACCEPTED_CREDENTIAL_TYPES: user-secret
      # The foreign server, on the private network shared only with this container.
      MCP_FOREIGN_URL: http://mcp-atlassian:8000
      MCP_FOREIGN_ALLOW_PLAIN_HTTP: "true"
      MCP_FOREIGN_AUTHORIZATION_FORMAT: "Token {credential}"
      MCP_FOREIGN_DISCOVERY_AUTHORIZATION: "Token discovery-only"
      MCP_ADAPTER_STRIP_PREFIX: jira_
      MCP_ADAPTER_TOOLS_INCLUDE: jira_get_issue,jira_search,jira_get_all_projects,jira_get_transitions
      # Inside the Docker network of the stack: plain http, as the gateway is allowed to connect to this server (allowPlainHttp).
      MCP_PLAIN_HTTP: "true"
      # Only for the dev stack, as for the native servers (see the dev stack): never outside it.
      SPRING_PROFILES_ACTIVE: devstack
      MCP_DEVSTACK_ACKNOWLEDGED: "true"
      AIWCORPO_MCP_PLATFORM_DEVSTACK_ACKNOWLEDGED: "true"
    networks:
      servers:
        aliases: [mcp-jira.internal]
      adapter-foreign: {}
    healthcheck:
      # bash, not the default /bin/sh of the image (dash has no /dev/tcp). A TCP connect is enough.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8443"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      mcp-atlassian: {condition: service_healthy}

networks:
  # Internal (no route out of the stack): the adapter and the foreign server, nothing else.
  adapter-foreign:
    internal: true
  # Internal: the foreign server and the Jira mock, nothing else.
  jira-foreign:
    internal: true
