# mcp-server-adapter on one Docker host, next to the foreign MCP server it fronts. Configuration: mcp-adapter.env, and certs/ only when you
# bring your own certificate.
#
# The gateway is elsewhere; this file runs the adapter only: its one-time jti is kept in memory (Redis only for several instances, see
# mcp-adapter.env) and the state volume keeps its self-signed certificate between starts. See README.md.
#
# One adapter serves one foreign server and one system: copy this directory once per server and change MCP_SERVER_ID in the env file.
# The foreign server is not started here. Reach it by MCP_FOREIGN_URL over a network that only the adapter and that server share
# (the adapter hands it the credential of the calling user); add that network under the service and under "networks:" as in
# docker-compose.demo.yml. Closed network: MCP_REGISTRY in a .env file next to this one points the image to your registry.

services:
  mcp-adapter:
    image: ${MCP_REGISTRY:-ghcr.io/aiwcorpo}/mcp-server-adapter:${MCP_ADAPTER_VERSION:-2.0.0}
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: mcp-adapter.env
    # The native Cedar library of the starter is unpacked to /tmp and loaded from there.
    tmpfs: ["/tmp:exec"]
    mem_limit: ${MCP_ADAPTER_MEM_LIMIT:-768m}
    volumes:
      # The generated certificate must be the same at every start, or the operator has to approve the connection again.
      - state:/var/lib/mcp/state
      # Only for your own certificate (MCP_TLS_CERT, MCP_TLS_KEY or MCP_TLS_KEYSTORE in mcp-adapter.env); the directory may stay empty.
      - ./certs:/certs:ro
    # The gateway connects here, to the address the operator enters in the portal.
    ports:
      - 8443:8443
    healthcheck:
      # An open port is the signal: the image has no HTTP client, and /actuator/health is the only path without a token.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8443"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

volumes:
  state:
